name: Build home bundle

on:
  workflow_dispatch:
    inputs:
      home:
        description: Home to build a bundle for
        required: true
        type: string

jobs:
  build-bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache nix store
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/nix
          key: nix-${{ runner.os }}-${{ hashFiles('npins/sources.json', 'sources/generated.json') }}
          restore-keys: nix-${{ runner.os }}-

      - name: Build bundle
        run: ./scripts/build-manifest-bundle.sh "${{ inputs.home }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.home }}-bundle
          path: dist/${{ inputs.home }}-bundle/
          include-hidden-files: true
          retention-days: 14
